openapi: 3.0.3
info:
  title: Ecoleta - Backend do Estabelecimento
  description: |-
    API consumida pelo aplicativo do Estabelecimento no Ecoleta.
    Permite cadastrar, consultar, atualizar e cancelar resíduos, visualizar ofertas recebidas, 
    aceitar ou recusar ofertas, acompanhar coletas e consultar o histórico de coletas concluídas e resíduos cancelados.
    Também permite consultar e atualizar os dados do perfil, além de alterar a senha.
    Cadastro e login são públicos; todas as demais operações exigem autenticação JWT.
  termsOfService: http://swagger.io/terms/
  contact:
    email: contato@ecoleta.com.br
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: http://localhost:8000/v1/ecoleta
tags:
  - name: Auth
  - name: Home
  - name: Meus Resíduos
  - name: Coletas
  - name: Histórico
  - name: Perfil

paths:

  # ===================== AUTH =====================
  /cadastro/estabelecimento:
    post:
      security: []
      tags: [Auth]
      summary: Cadastra um novo Estabelecimento
      requestBody:
        description: JSON contendo os dados do novo estabelecimento
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstabelecimentoCreate'
      responses:
        '201':
          description: Estabelecimento cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroEstabelecimentoResponse'
        '400':
          description: Invalid input
        '409':
          description: Dados já cadastrados
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server

  /login/estabelecimento:
    post:
      security: []
      tags: [Auth]
      summary: Autentica um Estabelecimento
      requestBody:
        description: JSON contendo CNPJ e senha
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
        '401':
          description: Credenciais inválidas
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server

  # ===================== HOME =====================
  /estabelecimento/home:
    get:
      tags: [Home]
      summary: Retorna os dados da Home do Estabelecimento autenticado
      description: >-
        Retorna o resumo e as ofertas recebidas pelo Estabelecimento autenticado.
        O ID do estabelecimento é obtido pelo JWT, sem parâmetros ou body.
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeEstabelecimento'
        '401':
          description: Unauthorized
        '404':
          description: Estabelecimento não encontrado
        '500':
          description: Error Internal Server

  # ===================== MEUS RESIDUOS =====================
  /estabelecimento/meus-residuos:
    get:
      tags: [Meus Resíduos]
      summary: Lista os resíduos do Estabelecimento autenticado
      description: >-
        Retorna os resíduos vinculados ao Estabelecimento autenticado.
        O ID do estabelecimento é obtido pelo JWT, sem parâmetros ou body.
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeusResiduosEstabelecimentoResponse'
        '400':
          description: ID do estabelecimento inválido
        '401':
          description: Unauthorized
        '404':
          description: Resíduos não encontrados
        '500':
          description: Error Internal Server

  /estabelecimento/meus-residuos/{id_residuo}:
    get:
      tags: [Meus Resíduos]
      summary: Busca os detalhes de uma coleta agendada pelo ID do resíduo
      description: >-
        Consulta os detalhes da coleta agendada vinculada ao resíduo informado,
        pertencente ao Estabelecimento autenticado pelo JWT.
        O parâmetro é o ID do resíduo, não o ID da coleta.
        Retorna um objeto em response. Não recebe body nem exige Content-Type.
      parameters:
        - name: id_residuo
          in: path
          required: true
          description: ID do resíduo consultado
          schema:
            type: integer
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColetaAgendadaEstabelecimentoResponse'
        '400':
          description: ID inválido
        '401':
          description: Unauthorized
        '404':
          description: Resíduo não encontrado
        '500':
          description: Error Internal Server

  /estabelecimento/residuos:
    post:
      tags: [Meus Resíduos, Home]
      summary: Cadastra um novo resíduo do Estabelecimento autenticado
      description: >-
        Cadastra um resíduo para o estabelecimento identificado pelo JWT.
        A data disponível deve ser uma data válida em DD/MM/AAAA e não pode
        ser anterior à data atual no fuso America/Sao_Paulo. O horário final
        deve ser posterior ao horário inicial.
      requestBody:
        description: Dados do resíduo para cadastro
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResiduoCadastroAtualizacao'
      responses:
        '201':
          description: Resíduo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResiduoCadastrarAtualizarResponse'
        '400':
          description: Dados do resíduo inválidos
        '401':
          description: Unauthorized
        '404':
          description: Registro necessário para o cadastro não encontrado
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /estabelecimento/residuos/{id_residuo}:
    put:
      tags: [Meus Resíduos]
      summary: Atualiza um resíduo do Estabelecimento autenticado
      description: >-
        Atualiza os dados de um resíduo identificado pelo ID da URL,
        pertencente ao estabelecimento autenticado pelo JWT.
        Utiliza os mesmos campos informados no cadastro do resíduo.
      parameters:
        - name: id_residuo
          in: path
          required: true
          description: ID do resíduo a ser atualizado
          schema:
            type: integer
      requestBody:
        description: Dados atualizados do resíduo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResiduoCadastroAtualizacao'
      responses:
        '200':
          description: Resíduo atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResiduoCadastrarAtualizarResponse'
        '400':
          description: Dados ou ID do resíduo inválidos
        '401':
          description: Unauthorized
        '404':
          description: Resíduo não encontrado
        '409':
          description: Conflito ao atualizar o resíduo
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /estabelecimento/residuos/{id_residuo}/cancelar:
    patch:
      tags: [Meus Resíduos]
      summary: Cancela um resíduo do Estabelecimento autenticado
      description: >-
        Cancela o resíduo identificado pelo ID da URL, registrando
        um novo status no histórico. O ID do estabelecimento vem do JWT.
        Não recebe body nem exige Content-Type.
      parameters:
        - name: id_residuo
          in: path
          required: true
          description: ID do resíduo a cancelar
          schema:
            type: integer
      responses:
        '200':
          description: Resíduo cancelado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResiduoCancelarResponse'
        '400':
          description: ID do resíduo inválido
        '401':
          description: Unauthorized
        '404':
          description: Resíduo não encontrado
        '409':
          description: Conflito ao cancelar o resíduo
        '500':
          description: Error Internal Server


  # ===================== COLETAS =====================
  /estabelecimento/ofertas/{id_oferta}/aceitar:
    post:
      tags: [Coletas]
      summary: Aceita uma oferta recebida e agenda a coleta
      description: >-
        Aceita a oferta inicial indicada pelo parâmetro id_oferta,
        registra o nome do funcionário aceitante e agenda a coleta.
        O ID do estabelecimento é obtido pelo JWT.
      parameters:
        - name: id_oferta
          in: path
          required: true
          description: ID da oferta inicial recebida pelo estabelecimento
          schema:
            type: integer
      requestBody:
        description: Nome do funcionário que aceita a oferta
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceitarOferta'
      responses:
        '200':
          description: Oferta aceita e coleta agendada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceitarOfertaResponse'
        '401':
          description: Unauthorized
        '404':
          description: Oferta ou recurso necessário não encontrado
        '409':
          description: Conflito ao aceitar a oferta
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /estabelecimento/ofertas/{id_oferta}/recusar:
    patch:
      tags: [Coletas]
      summary: Recusa uma oferta recebida pelo estabelecimento
      description: >-
        Recusa a oferta inicial indicada pelo parâmetro id_oferta,
        registrando a alteração de status no histórico.
        O ID do estabelecimento é obtido pelo JWT.
        Não recebe body nem exige Content-Type.
      parameters:
        - name: id_oferta
          in: path
          required: true
          description: ID da oferta inicial recebida pelo estabelecimento
          schema:
            type: integer
      responses:
        '200':
          description: Oferta recusada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecusarOfertaResponse'
        '401':
          description: Unauthorized
        '404':
          description: Oferta não encontrada
        '409':
          description: Conflito ao recusar a oferta
        '500':
          description: Error Internal Server


  /estabelecimento/coletas:
    get:
      tags: [Coletas]
      summary: Lista as ofertas recebidas na tela de Coletas do Estabelecimento
      description: >-
        Retorna as ofertas vinculadas ao Estabelecimento autenticado, incluindo
        ofertas Pendentes e Aceitas, conforme o retorno do backend.
        O ID do estabelecimento é obtido pelo JWT. Não recebe body.
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColetasEstabelecimentoResponse'
        '401':
          description: Unauthorized
        '404':
          description: Registros não encontrados
        '500':
          description: Error Internal Server

  /estabelecimento/coletas/{id_oferta_inicial}:
    get:
      tags: [Coletas]
      summary: Busca uma oferta da tela de Coletas pelo ID da oferta inicial
      description: >-
        Filtra pelo ID da oferta inicial recebido pela URL e pelo Estabelecimento
        autenticado via JWT. O campo response.resumo continua sendo um array.
        Não recebe body.
      parameters:
        - name: id_oferta_inicial
          in: path
          required: true
          description: ID da oferta inicial usada no filtro
          schema:
            type: integer
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColetasEstabelecimentoResponse'
        '401':
          description: Unauthorized
        '404':
          description: Oferta não encontrada
        '500':
          description: Error Internal Server

  # ===================== HISTORICO =====================
  /estabelecimento/historico:
    get:
      tags: [Histórico]
      summary: Lista o histórico do Estabelecimento autenticado
      description: >-
        Lista coletas concluídas e resíduos cancelados do estabelecimento
        identificado pelo JWT. O campo response.resumo é um array.
        Não recebe parâmetros nem body.
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricoEstabelecimentoResponse'
        '401':
          description: Unauthorized
        '404':
          description: Registros de histórico não encontrados
        '500':
          description: Error Internal Server

  /estabelecimento/historico/cancelado/{idResiduo}:
    get:
      tags: [Histórico]
      summary: Consulta os detalhes de um resíduo cancelado
      description: >-
        Busca o histórico do resíduo cancelado pelo ID da URL e pelo
        estabelecimento autenticado pelo JWT. response.resumo é um array.
        Não recebe body.
      parameters:
        - name: idResiduo
          in: path
          required: true
          description: ID do resíduo cancelado
          schema:
            type: integer
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricoResiduoCanceladoResponse'
        '401':
          description: Unauthorized
        '404':
          description: Resíduo cancelado não encontrado
        '500':
          description: Error Internal Server

  /estabelecimento/historico/concluida/{idColeta}:
    get:
      tags: [Histórico]
      summary: Consulta os detalhes de uma coleta concluída
      description: >-
        Busca o histórico da coleta concluída pelo ID da URL e pelo
        estabelecimento autenticado pelo JWT. response.resumo é um array.
        Não recebe body.
      parameters:
        - name: idColeta
          in: path
          required: true
          description: ID da coleta concluída
          schema:
            type: integer
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricoColetaConcluidaResponse'
        '401':
          description: Unauthorized
        '404':
          description: Coleta concluída não encontrada
        '500':
          description: Error Internal Server

  # ===================== PERFIL =====================
  /estabelecimento/perfil:
    get:
      tags: [Perfil]
      summary: Consulta os dados do perfil do Estabelecimento autenticado
      description: >-
        Consulta o perfil do Estabelecimento autenticado pelo JWT.
        O ID do estabelecimento vem do token. Não recebe body nem exige Content-Type.
      responses:
        '200':
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilEstabelecimentoResponse'
        '400':
          description: ID do estabelecimento inválido
        '401':
          description: Unauthorized
        '404':
          description: Perfil do estabelecimento não encontrado
        '500':
          description: Error Internal Server

    put:
      tags: [Perfil]
      summary: Atualiza os dados do perfil do Estabelecimento autenticado
      description: >-
        Atualiza os dados cadastrais e o endereço do Estabelecimento autenticado.
        O ID vem do JWT. O endereço alterado pode exigir geolocalização e
        atualização das distâncias vinculadas; conflitos retornam 409.
      requestBody:
        description: Dados editáveis do perfil do Estabelecimento
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilEstabelecimentoAtualizar'
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilEstabelecimentoAtualizarResponse'
        '400':
          description: Dados ou ID inválidos
        '401':
          description: Unauthorized
        '404':
          description: Perfil do estabelecimento não encontrado
        '409':
          description: Conflito de endereço, dados concorrentes ou dados duplicados
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /estabelecimento/perfil/senha:
    patch:
      tags: [Perfil]
      summary: Altera a senha do Estabelecimento autenticado
      description: >-
        Confere a senha atual e altera para uma nova senha diferente da anterior.
        A confirmação deve ser igual à nova senha. O ID do estabelecimento
        é obtido pelo JWT.
      requestBody:
        description: Senha atual, nova senha e confirmação da nova senha
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilEstabelecimentoSenha'
      responses:
        '200':
          description: Senha alterada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilEstabelecimentoSenhaResponse'
        '400':
          description: Dados ou ID inválidos, incluindo confirmação de senha incorreta
        '401':
          description: Unauthorized
        '404':
          description: Estabelecimento não encontrado
        '409':
          description: Senha atual incorreta ou nova senha igual à atual
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

components:
  schemas:
    EstabelecimentoCreate:
      type: object
      required:
        - nome_empresa
        - cnpj
        - cep
        - logradouro
        - bairro
        - cidade
        - nome_estado
        - sigla_estado
        - numero_local
        - email
        - telefone
        - senha
        - confirmar_senha
      properties:
        nome_empresa: {type: string, minLength: 1, maxLength: 100}
        cnpj: {type: string, maxLength: 25, description: CNPJ validado por função própria do backend}
        cep: {type: string, maxLength: 12, pattern: '^\d{5}-?\d{3}$'}
        logradouro: {type: string, minLength: 1, maxLength: 100}
        bairro: {type: string, minLength: 1, maxLength: 80}
        cidade: {type: string, minLength: 1, maxLength: 60}
        nome_estado: {type: string, minLength: 1, maxLength: 30}
        sigla_estado: {type: string, minLength: 2, maxLength: 2}
        numero_local: {type: integer, minimum: 1}
        email: {type: string, format: email, maxLength: 256}
        telefone: {type: string, maxLength: 25, pattern: '^[0-9]+$'}
        senha: {type: string, format: password, minLength: 8, maxLength: 30}
        confirmar_senha: {type: string, format: password, description: Deve ser igual ao campo senha}

    CadastroEstabelecimentoResponse:
      type: object
      properties:
        api_description: {type: string}
        development: {type: string}
        version: {type: string}
        response:
          type: object
          properties:
            id: {type: integer}
            nome_empresa: {type: string}
            cnpj: {type: string}
        status: {type: boolean}
        status_code: {type: integer}
        message: {type: string}

    Login:
      type: object
      required:
        - cnpj
        - senha
      properties:
        cnpj: {type: string}
        senha: {type: string, format: password}

    LoginResponse:
      type: object
      properties:
        api_description: {type: string}
        development: {type: string}
        version: {type: string}
        response:
          type: object
          properties:
            id: {type: integer}
            nome_empresa: {type: string}
            cnpj: {type: string}
            token: {type: string}
        status: {type: boolean}
        status_code: {type: integer}
        message: {type: string}

    HomeEstabelecimento:
      type: object
      properties:
        api_descreiption: {type: string}
        developers:
          type: array
          items:
            type: string
        version: {type: string}
        response:
          type: object
          properties:
            resumo:
              type: object
              properties:
                id_estabelecimento: {type: integer}
                nome_empresa: {type: string}
                residuos_disponiveis: {type: integer}
                soma_total_quantidade: {type: string}
                ofertas_recebidas: {type: integer}
                coletas_agendadas: {type: integer}
            ofertas:
              type: array
              items:
                type: object
                properties:
                  id_estabelecimento: {type: integer}
                  id_empresa_coletora: {type: integer}
                  nome_empresa_coletora: {type: string}
                  id_tipo_material: {type: integer}
                  material: {type: string}
                  id_residuo: {type: integer}
                  quantidade: {type: string}
                  data_disponivel: {type: string, description: Data no formato DD/MM/AAAA}
                  id_oferta_inicial: {type: integer}
                  valor_ofertado: {type: string}
                  status_oferta: {type: string}
        status: {type: boolean}
        status_code: {type: integer}

    MeusResiduosEstabelecimentoResponse:
      type: object
      properties:
        api_descreiption: {type: string}
        developers:
          type: array
          items:
            type: string
        version: {type: string}
        response:
          type: array
          items:
            type: object
            properties:
              id_residuo: {type: integer}
              id_estabelecimento: {type: integer}
              id_tipo_material: {type: integer}
              material: {type: string}
              quantidade: {type: string}
              data_disponivel: {type: string, description: Data no formato DD/MM/AAAA}
              horario_inicial: {type: string}
              horario_final: {type: string}
              observacao: {type: string}
              id_status_residuo: {type: integer}
              status_residuo: {type: string}
              status_card: {type: string}
        status: {type: boolean}
        status_code: {type: integer}

    # Detalhes da coleta agendada consultada pelo ID do resíduo
    ColetaAgendadaEstabelecimentoResponse:
      type: object
      properties:
        api_descreiption: {type: string}
        developers:
          type: array
          items:
            type: string
        version: {type: string}
        response:
          type: object
          properties:
            id_coleta: {type: integer}
            id_tipo_material: {type: integer}
            material: {type: string}
            id_status_coleta: {type: integer}
            status_coleta: {type: string}
            id_empresa_coletora: {type: integer}
            nome_empresa_coletora: {type: string}
            nome_ofertante: {type: string}
            id_oferta_aceita: {type: integer}
            nome_aceitante: {type: string}
            logradouro: {type: string}
            numero: {type: integer}
            bairro: {type: string}
            cidade: {type: string}
            quantidade: {type: string}
            data_disponivel: {type: string, description: Data no formato DD/MM/AAAA}
            horario_inicial: {type: string}
            horario_final: {type: string}
            observacao: {type: string}
            id_oferta_inicial: {type: integer}
            valor_acordado: {type: string}
            id_oferta_final: {type: integer}
            id_estabelecimento: {type: integer}
            id_residuo: {type: integer}
        status: {type: boolean}
        status_code: {type: integer}

    # Campos utilizados no cadastro (POST) e na atualização (PUT) de resíduos
    ResiduoCadastroAtualizacao:
      type: object
      required:
        - horario_inicial
        - horario_final
        - quantidade
        - data_disponivel
        - id_tipo_material
      properties:
        horario_inicial:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Horário no formato HH:mm ou HH:mm:ss. Deve ser anterior ao horário final.
        horario_final:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Horário no formato HH:mm ou HH:mm:ss. Deve ser posterior ao horário inicial.
        quantidade:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999.99
          multipleOf: 0.01
          description: Número positivo com no máximo duas casas decimais.
        data_disponivel:
          type: string
          pattern: '^\d{2}/\d{2}/\d{4}$'
          description: >-
            DD/MM/AAAA. O backend valida se a data existe no calendário
            e se não é anterior ao dia atual em America/Sao_Paulo.
        observacao:
          type: string
          nullable: true
          description: Opcional; pode ser texto, string vazia ou null.
        id_tipo_material:
          type: integer
          minimum: 1
          description: ID positivo do tipo de material.

    # Retorno dos endpoints POST e PUT; o sucesso é 201 no POST e 200 no PUT
    ResiduoCadastrarAtualizarResponse:
