openapi: 3.0.3
info:
  title: Projeto do SENAI Itapevi - Ecoleta
  description: |-
   API destinada ao gerenciamento de resíduos entre Estabelecimentos e Empresas Coletoras
  termsOfService: http://swagger.io/terms/
  contact:
    email: contato@ecoleta.com.br
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://
tags:
  - name: Auth
  - name: Estabelecimento
  - name: EmpresaColetora
  - name: Residuo
  - name: Oferta
  - name: Coleta
  - name: TipoMaterial
  - name: Estado
  - name: Cidade
  - name: Historico
  - name: Perfil
paths:

  # ===================== AUTH =====================
  /v1/senai/ecoleta/auth/login:
    post:
      tags:
        - Auth
      summary: Autentica uma conta
      description: Endpoint para autenticar um Estabelecimento ou uma Empresa Coletora e retornar o token de acesso
      requestBody:
        description: JSON contendo email, senha e o tipo da conta
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/auth/logout:
    post:
      tags:
        - Auth
      summary: Encerra a sessão atual
      description: Invalida o token de acesso da conta autenticada
      responses:
        '200':
          description: successful operation
        '401':
          description: Unauthorized
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/auth/recuperar-senha:
    post:
      tags:
        - Auth
      summary: Solicita a recuperação de senha
      description: >-
        Gera um token de recuperação e o envia por e-mail. Depende de uma
        tabela não presente no CREATE atual do banco
        (tbl_password_reset_token: id, token, id_conta, tipo_conta,
        expira_em, usado) para ser implementado com segurança.
      requestBody:
        description: JSON contendo o email e o tipo da conta
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenha'
        required: true
      responses:
        '202':
          description: successful operation
        '400':
          description: Invalid input
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/auth/redefinir-senha:
    post:
      tags:
        - Auth
      summary: Redefine a senha usando o token recebido
      requestBody:
        description: JSON contendo o token e a nova senha
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
        required: true
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid or expired token
        '500':
          description: Error Internal Server

  # ===================== ESTABELECIMENTO =====================
  /v1/senai/ecoleta/estabelecimento:
    post:
      tags:
        - Estabelecimento
      summary: Adiciona um novo estabelecimento
      description: Endpoint para enviar os dados do estabelecimento a serem cadastrados
      requestBody:
        description: JSON contendo os dados do novo estabelecimento a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstabelecimentoCreate'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '409':
          description: Email or CNPJ already registered
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server
    get:
      tags:
        - Estabelecimento
      summary: Lista todos os Estabelecimentos
      description: Listagem de todos os Estabelecimentos registrados no sistema
      parameters:
        - name: id_cidade
          in: query
          description: Filtra estabelecimentos por cidade
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estabelecimento'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/estabelecimento/{id}:
    get:
      tags:
        - Estabelecimento
      summary: Busca um Estabelecimento pelo ID
      description: Retorna um Estabelecimento pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do estabelecimento
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estabelecimento'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server
    put:
      tags:
        - Estabelecimento
      summary: Atualizar um estabelecimento pelo ID
      description: Buscar e atualizar um estabelecimento pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do Estabelecimento
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar um estabelecimento
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Estabelecimento'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/estabelecimento/{id}/home:
    get:
      tags:
        - Estabelecimento
      summary: Resumo da tela inicial do estabelecimento
      description: >-
        Retorna os cards de resumo (resíduos disponíveis, kg em materiais,
        ofertas pendentes, coletas agendadas) e a lista de ofertas
        recentes. Equivale às views vw_home_estabelecimento e
        vw_home_ofertas_estabelecimento.
      parameters:
        - name: id
          in: path
          description: ID do estabelecimento
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeEstabelecimento'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  # ===================== EMPRESA COLETORA =====================
  /v1/senai/ecoleta/empresacoletora:
    post:
      tags:
        - EmpresaColetora
      summary: Adiciona uma nova empresa coletora
      description: Endpoint para enviar os dados da empresa coletora a serem cadastrados
      requestBody:
        description: JSON contendo os dados da nova empresa coletora a ser inserida no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaColetoraCreate'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '409':
          description: Email or CNPJ already registered
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server
    get:
      tags:
        - EmpresaColetora
      summary: Lista todas as Empresas Coletoras
      description: Listagem de todas as Empresas Coletoras registradas no sistema
      parameters:
        - name: id_cidade
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmpresaColetora'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/empresacoletora/{id}:
    get:
      tags:
        - EmpresaColetora
      summary: Busca uma Empresa Coletora pelo ID
      description: Retorna uma Empresa Coletora pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaColetora'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server
    put:
      tags:
        - EmpresaColetora
      summary: Atualizar uma empresa coletora pelo ID
      description: Buscar e atualizar uma empresa coletora pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar uma empresa coletora
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaColetora'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  # ===================== RESIDUO =====================
  /v1/senai/ecoleta/residuo:
    post:
      tags:
        - Residuo
      summary: Adiciona um novo resíduo
      description: >-
        Endpoint para o Estabelecimento cadastrar um resíduo disponível
        (id_estabelecimento é obtido do token, não do body). Cria a linha
        em tbl_residuo e o primeiro registro em
        tbl_status_residuo_historico com status 'Disponível'.
      requestBody:
        description: JSON contendo os dados do novo resíduo a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResiduoCreate'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server
    get:
      tags:
        - Residuo
      summary: Lista todos os Resíduos
      description: >-
        Listagem de todos os Resíduos registrados no sistema (marketplace),
        com filtros opcionais
      parameters:
        - name: id_estabelecimento
          in: query
          required: false
          schema:
            type: integer
        - name: id_tipo_material
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          description: 'Disponível, Agendado ou Cancelado'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Residuo'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/residuo/{id}:
    get:
      tags:
        - Residuo
      summary: Busca um Resíduo pelo ID
      description: Retorna um Resíduo pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Residuo'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server
    put:
      tags:
        - Residuo
      summary: Atualizar um resíduo pelo ID
      description: >-
        Buscar e atualizar os campos de um resíduo pelo ID. Este endpoint
        NÃO altera o status do resíduo — usar PATCH
        /residuo/{id}/status para isso, já que status é uma tabela de
        histórico (tbl_status_residuo_historico), não uma coluna.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar um resíduo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Residuo'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server
    delete:
      tags:
        - Residuo
      summary: Excluir um resíduo pelo ID
      description: >-
        Buscar e excluir um resíduo pelo ID. Só é permitido se não houver
        nenhuma linha em tbl_oferta_inicial referenciando este resíduo
        (a FK impede a exclusão). Se já existir oferta, usar PATCH
        /residuo/{id}/status com status 'Cancelado' em vez de excluir.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '409':
          description: Existem ofertas vinculadas a este resíduo; use status Cancelado em vez de excluir
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/residuo/{id}/status:
    patch:
      tags:
        - Residuo
      summary: Registra uma mudança de status do resíduo
      description: Insere um novo registro em tbl_status_residuo_historico (não sobrescreve o anterior)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: JSON contendo o novo status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  # ===================== OFERTA =====================
  /v1/senai/ecoleta/oferta:
    post:
      tags:
        - Oferta
      summary: Adiciona uma nova oferta
      description: >-
        Endpoint para a Empresa Coletora enviar uma oferta por um resíduo.
        Cria a linha em tbl_oferta_inicial e o primeiro registro em
        tbl_status_oferta_historico com status 'Pendente'. Se não existir
        um registro em tbl_distancia para o par (estabelecimento dono do
        resíduo, empresa coletora do token), o backend deve calculá-lo e
        inseri-lo antes de responder.
      requestBody:
        description: JSON contendo os dados da nova oferta a ser inserida no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaCreate'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '404':
          description: Resíduo não encontrado
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server
    get:
      tags:
        - Oferta
      summary: Lista todas as Ofertas
      description: >-
        Listagem de todas as Ofertas visíveis para a conta autenticada
        (enviadas, se Empresa Coletora; recebidas, se Estabelecimento)
      parameters:
        - name: status
          in: query
          description: 'Pendente, Aceita ou Recusada'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Oferta'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/oferta/{id}:
    get:
      tags:
        - Oferta
      summary: Busca uma Oferta pelo ID
      description: Retorna uma Oferta pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/oferta/{id}/aceitar:
    put:
      tags:
        - Oferta
      summary: Aceita uma oferta pelo ID
      description: >-
        O Estabelecimento aceita a oferta recebida. O backend DEVE validar
        que o id_estabelecimento do token é o mesmo dono do resíduo
        associado à oferta (via oferta_inicial -> residuo) antes de
        prosseguir, retornando 403 caso contrário — essa checagem é
        obrigatória porque tbl_oferta_aceita não guarda referência à
        oferta_inicial, então nada no banco garante essa consistência
        sozinho.

        Em uma única transação, executa:
        1. INSERT tbl_oferta_aceita
        2. INSERT tbl_oferta_final (liga oferta_inicial + oferta_aceita)
        3. INSERT tbl_status_oferta_historico -> 'Aceita'
        4. INSERT tbl_status_residuo_historico -> 'Agendado'
        5. INSERT tbl_coleta (id_oferta_final)
        6. INSERT tbl_status_coleta_historico -> 'Agendada'
      parameters:
        - name: id
          in: path
          description: ID da oferta inicial a ser aceita
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: JSON contendo o nome de quem está aceitando
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaAceitar'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaAceitaResponse'
        '400':
          description: Invalid ID supplied
        '403':
          description: A conta autenticada não é dona do resíduo associado a esta oferta
        '404':
          description: Not found
        '409':
          description: Oferta já foi aceita ou recusada anteriormente
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/oferta/{id}/recusar:
    put:
      tags:
        - Oferta
      summary: Recusa uma oferta pelo ID
      description: >-
        Insere apenas um registro em tbl_status_oferta_historico ->
        'Recusada'. Não altera o status do resíduo, que continua elegível
        a receber outras ofertas. Mesma validação de posse do endpoint
        /aceitar.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '403':
          description: A conta autenticada não é dona do resíduo associado a esta oferta
        '404':
          description: Not found
        '409':
          description: Oferta já foi aceita ou recusada anteriormente
        '500':
          description: Error Internal Server

  # ===================== COLETA =====================
  /v1/senai/ecoleta/coleta:
    get:
      tags:
        - Coleta
      summary: Lista todas as Coletas
      description: Listagem de todas as Coletas visíveis para a conta autenticada
      parameters:
        - name: status
          in: query
          description: 'Agendada ou Concluída'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coleta'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/coleta/{id}:
    get:
      tags:
        - Coleta
      summary: Busca uma Coleta pelo ID
      description: Retorna uma Coleta pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coleta'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server
    put:
      tags:
        - Coleta
      summary: Atualizar uma coleta pelo ID
      description: >-
        A Empresa Coletora preenche os dados de execução (nome_coletor,
        placa_veiculo, data_coleta, hora_coleta). Este endpoint NÃO altera
        o status da coleta — usar PATCH /coleta/{id}/status para isso.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados de execução da coleta a serem preenchidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColetaUpdate'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/coleta/{id}/status:
    patch:
      tags:
        - Coleta
      summary: Registra uma mudança de status da coleta
      description: >-
        Insere um novo registro em tbl_status_coleta_historico. Ao marcar
        'Concluída', deve-se avaliar também disparar um novo status de
        resíduo (ex: 'Coletado' — valor ainda não existente em
        tbl_status_residuo; decisão de modelagem em aberto).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: JSON contendo o novo status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  # ===================== TIPO DE MATERIAL =====================
  /v1/senai/ecoleta/tipomaterial:
    post:
      tags:
        - TipoMaterial
      summary: Adiciona um novo tipo de material
      description: Endpoint para enviar os dados do tipo de material a serem cadastrados
      requestBody:
        description: JSON contendo os dados do novo tipo de material a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoMaterial'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '415':
          description: Error Content-type
        '500':
          description: Error Internal Server
    get:
      tags:
        - TipoMaterial
      summary: Lista todos os Tipos de Material
      description: Listagem de todos os Tipos de Material registrados no sistema
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoMaterial'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/tipomaterial/{id}:
    get:
      tags:
        - TipoMaterial
      summary: Busca um Tipo de Material pelo ID
      description: Retorna um Tipo de Material pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoMaterial'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server
    put:
      tags:
        - TipoMaterial
      summary: Atualizar um tipo de material pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar um tipo de material
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoMaterial'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server
    delete:
      tags:
        - TipoMaterial
      summary: Excluir um tipo de material pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '409':
          description: Existem resíduos vinculados a este tipo de material
        '500':
          description: Error Internal Server

  # ===================== ESTADO =====================
  /v1/senai/ecoleta/estado:
    get:
      tags:
        - Estado
      summary: Lista todos os Estados
      description: Listagem de todos os Estados registrados no sistema
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estado'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/estado/{id}:
    get:
      tags:
        - Estado
      summary: Busca um Estado pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  # ===================== CIDADE =====================
  /v1/senai/ecoleta/estado/{id}/cidade:
    get:
      tags:
        - Cidade
      summary: Lista as Cidades de um Estado
      description: Listagem de todas as Cidades pertencentes ao Estado informado
      parameters:
        - name: id
          in: path
          description: ID do estado
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cidade'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/cidade/{id}:
    get:
      tags:
        - Cidade
      summary: Busca uma Cidade pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cidade'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not found
        '500':
          description: Error Internal Server

  # ===================== HISTORICO =====================
  /v1/senai/ecoleta/historico:
    get:
      tags:
        - Historico
      summary: Lista o feed de atividades da conta autenticada
      description: >-
        Endpoint de leitura pura, sem tabela correspondente — faz UNION de
        tbl_status_residuo_historico, tbl_status_oferta_historico e
        tbl_status_coleta_historico filtradas pela conta autenticada,
        ordenado por data_hora_status desc.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricoEvento'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server

  # ===================== PERFIL =====================
  /v1/senai/ecoleta/perfil:
    get:
      tags:
        - Perfil
      summary: Retorna o perfil da conta autenticada
      description: >-
        Equivale a vw_perfil_estabelecimento ou vw_perfil_empresa_coletora,
        conforme o tipo de conta do token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Estabelecimento'
                  - $ref: '#/components/schemas/EmpresaColetora'
        '401':
          description: Unauthorized
        '500':
          description: Error Internal Server
    put:
      tags:
        - Perfil
      summary: Atualiza o perfil da conta autenticada
      requestBody:
        description: Dados para atualizar o perfil
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Estabelecimento'
                - $ref: '#/components/schemas/EmpresaColetora'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

  /v1/senai/ecoleta/perfil/senha:
    put:
      tags:
        - Perfil
      summary: Troca a senha da conta autenticada
      requestBody:
        description: JSON contendo a senha atual e a nova senha
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilSenha'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Senha atual incorreta
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server

components:
  schemas:

    # ---------- Auxiliares ----------
    Endereco:
      required:
        - cep
        - logradouro
        - numero
        - bairro
        - id_cidade
      type: object
      properties:
        id:
          type: integer
        cep:
          type: string
          maxLength: 12
          example: "06401-000"
        logradouro:
          type: string
          maxLength: 100
        numero:
          type: integer
        bairro:
          type: string
          maxLength: 80
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        id_cidade:
          type: integer
          description: ID da cidade relacionada ao endereço

    Estado:
      required:
        - sigla
        - nome_estado
      type: object
      properties:
        id:
          type: integer
        sigla:
          type: string
          maxLength: 3
          example: "SP"
        nome_estado:
          type: string
          maxLength: 30
          example: "São Paulo"

    Cidade:
      required:
        - nome_cidade
        - id_estado
      type: object
      properties:
        id:
          type: integer
        nome_cidade:
          type: string
          maxLength: 60
          example: "Itapevi"
        id_estado:
          type: integer
          description: ID do estado relacionado à cidade

    TipoMaterial:
      required:
        - material
      type: object
      properties:
        id:
          type: integer
        material:
          type: string
          maxLength: 50
          example: "Papelão"

    # ---------- Contas ----------
    Estabelecimento:
      required:
        - nome
        - cnpj
        - email
        - endereco
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          maxLength: 100
          example: "Padaria Central de Itapevi"
        cnpj:
          type: string
          maxLength: 25
          example: "34.567.890/0001-03"
        email:
          type: string
          maxLength: 256
          format: email
        telefone:
          type: string
          maxLength: 25
        endereco:
          $ref: '#/components/schemas/Endereco'

    EstabelecimentoCreate:
      allOf:
        - $ref: '#/components/schemas/Estabelecimento'
        - type: object
          required:
            - senha
          properties:
            senha:
              type: string
              format: password
              minLength: 8

    EmpresaColetora:
      required:
        - nome
        - cnpj
        - email
        - endereco
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          maxLength: 100
          example: "Coletora XYZ Transportes"
        cnpj:
          type: string
          maxLength: 25
        email:
          type: string
          maxLength: 256
          format: email
        telefone:
          type: string
          maxLength: 25
        endereco:
          $ref: '#/components/schemas/Endereco'

    EmpresaColetoraCreate:
      allOf:
        - $ref: '#/components/schemas/EmpresaColetora'
        - type: object
          required:
            - senha
          properties:
            senha:
              type: string
              format: password
              minLength: 8

    # ---------- Residuo ----------
    Residuo:
      required:
        - horario_inicial
        - horario_final
        - quantidade
        - data_disponivel
        - id_tipo_material
      type: object
      properties:
        id:
          type: integer
        horario_inicial:
          type: string
          format: time
          example: "08:00:00"
        horario_final:
          type: string
          format: time
          example: "12:00:00"
        quantidade:
          type: number
          format: double
          example: 15.0
        data_disponivel:
          type: string
          format: date
          example: "2026-06-10"
        observacao:
          type: string
        id_tipo_material:
          type: integer
          description: ID do tipo de material relacionado ao resíduo
        tipo_material:
          $ref: '#/components/schemas/TipoMaterial'
          description: Retornado nas consultas (GET) no lugar de id_tipo_material
        id_estabelecimento:
          type: integer
          description: Preenchido automaticamente a partir do token no POST; somente leitura
        status_atual:
          type: string
          description: Derivado do último registro em tbl_status_residuo_historico
          enum:
            - Disponível
            - Agendado
            - Cancelado

    ResiduoCreate:
      required:
        - horario_inicial
        - horario_final
        - quantidade
        - data_disponivel
        - id_tipo_material
      type: object
      properties:
        horario_inicial:
          type: string
          format: time
        horario_final:
          type: string
          format: time
        quantidade:
          type: number
          format: double
        data_disponivel:
          type: string
          format: date
        observacao:
          type: string
        id_tipo_material:
          type: integer

    # ---------- Oferta ----------
    OfertaCreate:
      required:
        - valor_ofertado
        - nome_ofertante
        - id_residuo
      type: object
      properties:
        valor_ofertado:
          type: number
          format: double
          example: 150.00
        nome_ofertante:
          type: string
          maxLength: 100
        id_residuo:
          type: integer
          description: ID do resíduo para o qual a oferta está sendo feita

    Oferta:
      type: object
      description: >-
        Representa a linha de tbl_oferta_inicial já enriquecida com dados
        da empresa coletora, do resíduo e do status atual
      properties:
        id:
          type: integer
        valor_ofertado:
          type: number
          format: double
        nome_ofertante:
          type: string
        data_hora_oferta:
          type: string
          format: date-time
        status_atual:
          type: string
          enum:
            - Pendente
            - Aceita
            - Recusada
        empresa_coletora:
          $ref: '#/components/schemas/EmpresaColetora'
        residuo:
          $ref: '#/components/schemas/Residuo'
        coleta_id:
          type: integer
          nullable: true
          description: Preenchido somente depois que a oferta é aceita

    OfertaAceitar:
      required:
        - nome_aceitante
      type: object
      properties:
        nome_aceitante:
          type: string
          maxLength: 100

    OfertaAceitaResponse:
      type: object
      properties:
        oferta:
          $ref: '#/components/schemas/Oferta'
        coleta:
          $ref: '#/components/schemas/Coleta'

    # ---------- Coleta ----------
    Coleta:
      type: object
      properties:
        id:
          type: integer
        nome_coletor:
          type: string
          maxLength: 100
          nullable: true
        placa_veiculo:
          type: string
          maxLength: 12
          nullable: true
        data_coleta:
          type: string
          format: date
          nullable: true
        hora_coleta:
          type: string
          format: time
          nullable: true
        id_oferta_final:
          type: integer
        status_atual:
          type: string
          enum:
            - Agendada
            - Concluída

    ColetaUpdate:
      type: object
      properties:
        nome_coletor:
          type: string
          maxLength: 100
        placa_veiculo:
          type: string
          maxLength: 12
        data_coleta:
          type: string
          format: date
        hora_coleta:
          type: string
          format: time

    # ---------- Status / Histórico ----------
    StatusUpdate:
      required:
        - status
      type: object
      properties:
        status:
          type: string

    HistoricoEvento:
      type: object
      description: Item de feed agregado (não corresponde a uma única tabela)
      properties:
        tipo:
          type: string
          enum:
            - residuo
            - oferta
            - coleta
        id_referencia:
          type: integer
        status:
          type: string
        data_hora_status:
          type: string
          format: date-time

    HomeEstabelecimento:
      type: object
      properties:
        residuos_disponiveis:
          type: integer
        soma_total_quantidade:
          type: number
        ofertas_recebidas:
          type: integer
        coletas_agendadas:
          type: integer
        ofertas_pendentes:
          type: array
          items:
            $ref: '#/components/schemas/Oferta'

    # ---------- Auth / Perfil ----------
    Login:
      required:
        - email
        - senha
        - tipo_conta
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
        tipo_conta:
          type: string
          enum:
            - estabelecimento
            - empresa_coletora
          description: >-
            Necessário porque o email não é único entre tbl_estabelecimento
            e tbl_empresa_coletora, que são tabelas separadas

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tipo_conta:
          type: string

    RecuperarSenha:
      required:
        - email
        - tipo_conta
      type: object
      properties:
        email:
          type: string
          format: email
        tipo_conta:
          type: string
          enum:
            - estabelecimento
            - empresa_coletora

    RedefinirSenha:
      required:
        - token
        - nova_senha
      type: object
      properties:
        token:
          type: string
        nova_senha:
          type: string
          format: password
          minLength: 8

    PerfilSenha:
      required:
        - senha_atual
        - nova_senha
      type: object
      properties:
        senha_atual:
          type: string
          format: password
        nova_senha:
          type: string
          format: password
          minLength: 8

  requestBodies:
    Estabelecimento:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Estabelecimento'
    EmpresaColetora:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmpresaColetora'
    Residuo:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Residuo'
    Oferta:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfertaCreate'
    Coleta:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ColetaUpdate'
    TipoMaterial:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TipoMaterial'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []